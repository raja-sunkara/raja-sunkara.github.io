- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Statistical Machine Learning Lab (Prof. Ardhendu Tripathy), Missouri S&T
      year: Dec 2022 – present
      description:
        - Developed adaptive partitioning schemes for optimistic black-box optimization that learn a function's low-dimensional structure, with provably better regret than SequOOL (ICML 2025; NeurIPS 2024 OPT workshop).
        - Framed weight quantization of large language models as a black-box optimization task, reducing perplexity.
        - Working on pure-exploration algorithms for multi-armed bandits.
    - title: Graduate Research Assistant
      institution: Securing AI and IoT Lab (Prof. Tie Luo), Missouri S&T
      year: Aug 2021 – Dec 2022
      description:
        - Proposed SPD-Conv, a CNN building block for small objects and low-resolution images (ECML PKDD 2022).
        - Designed YOGA, a lightweight object detector with multiscale attention for edge devices (Pattern Recognition 2023).
        - Built a multi-label latent diffusion model that generates chest X-ray images for training medical-imaging models.
        - Explored text-to-video generation with reinforcement learning and diffusion models.

